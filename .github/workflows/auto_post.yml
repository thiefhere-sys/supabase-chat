name: Telegram Video Auto Poster

on:
  workflow_dispatch: # GitHub web UI se manually run karne ke liye
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante me auto run hoga

permissions:
  contents: write # Git push permission grant karta hai

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Automation Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # Dynamic history file save karne ke liye Commit and Push Step
      - name: Save Uploaded History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add uploaded_urls.txt || true
          git diff-index --quiet HEAD || (git commit -m "Update uploaded video history [skip ci]" && git push)
